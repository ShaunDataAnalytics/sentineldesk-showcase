[build]
  publish = "dist"
  command = "npm run build"

# Proxy API calls directly to the upstream AI engine / gateway
[[redirects]]
  from = "/api/*"
  to = "https://api.maplestreettax.site/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
